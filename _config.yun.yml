title: 云游君的小站
subtitle: All at sea.
description: 希望能成为一个有趣的人
keywords:
  - YunYouJun
  - Blog
  - 云游君
  - 博客
  - 云游君的小站
  - yunyoujun.cn
  - www.yunyoujun.cn
author: 云游君
# language:
#   - zh-CN
#   - en
language: zh-CN
timezone: Asia/Shanghai
favicon: /favicon.ico
fireworks:
  enable: true
  colors:
    - '102, 167, 221'
    - '62, 131, 225'
    - '33, 78, 194'
banner:
  enable: true
  title: 世界需要七休日
  border: true
  cloud:
    enable: true
    color: white
  go_down:
    enable: true
    icon: ri:arrow-down-s-line
notice:
  enable: true
  content: 欢迎光临我的世界
bg_image:
  enable: true
  url: /images/background-remiel-light.webp
  dark: /images/background-dark.webp
  blur: 10px # 设置背景模糊程度
  opacity: 0.8
avatar:
  enable: true
  url: /images/niyijiku-avatar.webp
  rounded: true
  opacity: 1
  mickey_mouse: false
  status:
    enable: true
    emoji: 👍
    message: 四季花开
sidebar:
  bg_image: https://cdn.jsdelivr.net/gh/YunYouJun/cdn/img/bg/stars-timing-1.jpg
  bg_position: bottom 3rem center
  tagcloud:
    enable:true
    amount::2
social:
  - name: RSS
    # set rss in your root config
    # https://github.com/hexojs/hexo-generator-feed
    link: /atom.xml # config.feed.path
    icon: ri:rss-line
    color: orange
  - name: GitHub
    link: https://github.com/Wanglihan954
    icon: ri:github-line
    color: '#f4f5f2'
  - name: E-Mail
    link: mailto:admin@yemengstar.com
    icon: ri:mail-line
    color: '#8E71C1'
  # - name: 微博
  #   link: #
  #   icon: ri:weibo-line
  #   color: '#E6162D'
  # - name: 豆瓣
  #   link: #
  #   icon: ri:douban-line
  #   color: '#007722'
  - name: 网易云音乐
    link: https://music.163.com/#/user/home?id=1485292158
    icon: ri:netease-cloud-music-line
    color: '#C10D0C'
  - name: QQ音乐
    link: https://y.qq.com/n/ryqq/msg_center
    icon: ri:qq-line
    color: '#10A983' # 常见的QQ音乐主题色
  - name: 知乎
    link: https://www.zhihu.com/people/xiao-wang-52-36-47
    icon: ri:zhihu-line
    color: '#0084FF'
  - name: 哔哩哔哩
    link: https://space.bilibili.com/435092993
    icon: ri:bilibili-line
    color: '#FF8EB3'
  # - name: 微信公众号
  #   link: #
  #   icon: ri:wechat-2-line
  #   color: '#1AAD19'

# 首页个人主页卡片文案；与站点全局标题分开配置。
home_profile:
  title: 宁翰のHEXO
  subtitle: 我的世界
  description: 踏着梦走过时光

menu:
  # 顶部导航中央名称；留空时回退到 _config.yml 的 title。
  brand: Seventh Knot
  # 左下角黄色标牌；设为空字符串可隐藏。
  badge: INTER-KNOT // 20020730
  mobile:
    title: 菜单
    icon: ri:menu-line
  home:
    title: 首页
    path: /
    icon: ri:home-4-line
  list:
    # icon 使用 Iconify；image 显示原色图片；mask_image 将图片变成可继承颜色的图标。
    - title: 归档
      type: archives
      path: /archives/
      icon: ri:archive-line
    - title: 分类
      type: categories
      path: /categories/
      icon: ri:folder-2-line
    - title: 标签
      type: tags
      path: /tags/
      icon: ri:price-tag-3-line
    - title: 代理人档案
      path: /girls/
      mask_image: /images/bangboo-nav.png
    - title: 项目终端
      path: /projects/
      icon: ri:radar-line
  actions:
    theme:
      title: 切换主题
      icon: ri:contrast-2-line
    search:
      title: 搜索
      icon: ri:search-line

colors:
  # Keep Yun's weighted tag cloud, recolored for the Inter-Knot skin.
  tag_start_color: "#f6ff00"
  tag_end_color: "#19a7ff"

wordcloud:
  # The reference site uses Yun's responsive text tag cloud rather than canvas.
  enable: false
girls:
  enable: true
pages:
  - name: 代理人列表
    url: /girls/
    image: /images/bangboo-nav.png
    color: '#ffffff'
  - name: 项目终端
    url: /projects/
    icon: ri:radar-line
    color: '#ffffff'

wordcount:
  enable: true
  count: true
  time: true

post_card:
  preview:
    enable: true
    max_chars: 620
    max_blocks: 4

footer:
  since: 2025
  icon:
    name: ri:cloud-line
    animated: true
    color: '#0078E7'
  live_time:
    enable: true
    prefix: 本博客已萌萌哒地运行
    suffix: (●'◡'●)
    start_time: '2025-04-12T00:00:00'
scrollreveal:
  enable: true
  targets:
    - .post-card
    - .markdown-body img
utterances:
  enable: true
  repo: Wanglihan954/disscussion
  issue-term: pathname
  label: comment
  theme: github-light
waline:
  enable: true
  serverURL: https://comment.20020730.xyz
  visitor: true
  comment: true
  emoji:
    - //unpkg.com/@waline/emojis@1.1.0/weibo
    - name: 嗯呢漫布
      folder: /images/zzz-stickers
      prefix: bangboo-
      type: jpg
      icon: /images/zzz-stickers/bangboo-thanks.jpg
      items:
        - gift
        - thanks
        - rest
    - name: 丽都漫步
      folder: /images/zzz-stickers
      prefix: lidu-
      type: png
      icon: /images/zzz-stickers/lidu-anby.png
      items:
        - anby
        - nekomata
        - lycaon
        - rina
        - soldier11
        - wise
comment:
  enable: true
  tips:
    - 若您想及时得到回复提醒，建议跳转 GitHub Issues 评论。
    - 若没有本文 Issue，您可以使用 Comment 模版新建。
  candidates:
    - waline
    - utterances

medium_zoom: true
engine_search:
  enable: false
  href: 'https://www.google.com/search?q=site:'
  # href: "https://www.baidu.com/s?wd=site:"
  # href: "https://www.bing.com/search?q=site:"
  domain: 20020730.xyz
local_search:
  enable: fasle
search:
  enable: true   # 开启弹窗搜索
  engine: local_search
katex:
  copy_tex: true
  global: true
  options: {
  renderMathInElement: true, 
  strict: "ignore", 
  output: "htmlAndMathml",
  displayMode: true,
  trust: true }
# 在配置文件中找到或添加这段代码
head:
  css:
    - /css/custom_theme.css?v=20260824-1
    - /css/projects.css?v=20260817-1
  js:
    defer:
      - /js/web-pet.js
      - /js/mobile-navigation.js
      - /js/home-intro.js?v=20260810-6

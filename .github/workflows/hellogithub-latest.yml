name: HelloGitHub Latest

on:
  workflow_dispatch:
  push:
    branches:
      - test
      - main
    paths:
      - ".github/workflows/hellogithub-latest.yml"
      - "_config.yun.yml"
      - "package.json"
      - "source/_data/hellogithub.json"
      - "source/css/projects.css"
      - "source/images/hellogithub/**"
      - "source/images/github-avatars/**"
      - "source/images/interknot/**"
      - "source/js/projects.js"
      - "source/projects/**"
      - "themes/yun/layout/projects.pug"
      - "tools/hellogithub/**"
  schedule:
    # 北京时间每天 09:15 检查；HelloGitHub 未发布新一期时不会产生提交。
    - cron: "15 1 * * *"

concurrency:
  group: hellogithub-latest-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ github.token }}
      WEBLOG_DEPLOY_TOKEN: ${{ secrets.WEBLOG_DEPLOY_TOKEN }}

    steps:
      - name: Checkout weblog source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test HelloGitHub sync
        run: npm run test:hellogithub

      - name: Sync latest HelloGitHub issue
        run: npm run hellogithub:update

      - name: Build Hexo site
        run: npm run build

      - name: Commit updated issue
        shell: bash
        run: |
          git config user.name "hellogithub-sync[bot]"
          git config user.email "hellogithub-sync[bot]@users.noreply.github.com"
          git add source/_data/hellogithub.json source/images/hellogithub source/images/github-avatars
          if git diff --cached --quiet; then
            echo "HelloGitHub is already current."
          else
            git commit -m "content: sync latest HelloGitHub issue"
            git push
          fi

      - name: Checkout production Pages repository
        if: github.ref == 'refs/heads/main' && env.WEBLOG_DEPLOY_TOKEN != ''
        uses: actions/checkout@v6
        with:
          repository: Wanglihan954/Wanglihan954.github.io
          token: ${{ env.WEBLOG_DEPLOY_TOKEN }}
          path: .hellogithub-deploy
          fetch-depth: 1

      - name: Publish generated site
        if: github.ref == 'refs/heads/main' && env.WEBLOG_DEPLOY_TOKEN != ''
        shell: bash
        run: |
          rsync -a --delete --exclude='.git/' public/ .hellogithub-deploy/
          cd .hellogithub-deploy
          git config user.name "hellogithub-sync[bot]"
          git config user.email "hellogithub-sync[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "Production site is already current."
          else
            git commit -m "deploy: HelloGitHub ${GITHUB_SHA::7}"
            git push
          fi

      - name: Explain skipped production deployment
        if: github.ref == 'refs/heads/main' && env.WEBLOG_DEPLOY_TOKEN == ''
        run: echo "WEBLOG_DEPLOY_TOKEN is not configured; source data was updated but production deployment was skipped."
